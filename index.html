<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Care Sri Lanka</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
  <div id="root">ජනනය වෙමින් පවතී...</div>

  <script type="text/babel">
    const { useState } = React;

    const servicesData = {
      "කොළඹ": [
        { name: "Colombo Auto Care & Hybrid Hub", type: "හයිබ්‍රිඩ් සහ එන්ජින් පරීක්ෂාව", phone: "0112345678" },
        { name: "City Breakdown & Towing Service", type: "හදිසි සහන සහ ටෝවිං", phone: "0119876543" }
      ],
      "මහනුවර": [
        { name: "Kandy Super Auto Repairs", type: "සාමාන්‍ය අලුත්වැඩියා සහ ටයර්", phone: "0812233445" },
        { name: "Hill Country Emergency Help", type: "හදිසි මාර්ග ආධාර", phone: "0815566778" }
      ],
      "කෑගල්ල": [
        { name: "Kegalle Auto Engineers", type: "එන්ජින් සහ විදුලි වැඩ", phone: "0352223344" },
        { name: "Sabargamuwa Breakdown Service", type: "හදිසි සහන", phone: "0357788990" }
      ]
    };

    function App() {
      const [selectedDistrict, setSelectedDistrict] = useState("කොළඹ");

      return (
        <div className="min-h-screen bg-slate-900 text-white p-4 pb-12">
          <div className="max-w-md mx-auto">
            {/* Header */}
            <div className="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center mb-6">
              <h1 className="text-2xl font-bold text-red-500 mb-1">Auto Care Sri Lanka</h1>
              <p className="text-slate-300 text-sm">පරිපූර්ණ වාහන සේවා සහ හදිසි සහන යෙදුම</p>
            </div>

            {/* Emergency Hotline Banner */}
            <div className="bg-red-600 p-4 rounded-xl shadow-lg mb-6 text-center">
              <h2 className="font-bold text-lg mb-1">🚨 හදිසි ඇමතුම් (Emergency)</h2>
              <p className="text-sm mb-2">පොලිසිය / ගිනි නිවන / ඇඹුලන්ස්</p>
              <a href="tel:119" className="inline-block bg-white text-red-600 font-bold py-2 px-6 rounded-lg shadow hover:bg-slate-100 transition">
                අමතන්න: 119
              </a>
            </div>

            {/* District Selector */}
            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
              <label className="block text-sm font-semibold mb-2 text-slate-300">දිස්ත්‍රික්කය තෝරන්න:</label>
              <select 
                value={selectedDistrict} 
                onChange={(e) => setSelectedDistrict(e.target.value)}
                className="w-full bg-slate-900 text-white border border-slate-700 rounded-xl p-3 focus:outline-none focus:border-red-500"
              >
                {Object.keys(servicesData).map((district) => (
                  <option key={district} value={district}>{district}</option>
                ))}
              </select>
            </div>

            {/* Services List */}
            <div className="space-y-4">
              <h3 className="text-lg font-bold text-slate-200">{selectedDistrict} දිස්ත්‍රික්කයේ සේවා</h3>
              {servicesData[selectedDistrict].map((service, index) => (
                <div key={index} className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                  <div>
                    <h4 className="font-bold text-white">{service.name}</h4>
                    <p className="text-xs text-slate-400">{service.type}</p>
                  </div>
                  <a 
                    href={`tel:${service.phone}`} 
                    className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-4 rounded-lg transition"
                  >
                    ඇමතුම්
                  </a>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
