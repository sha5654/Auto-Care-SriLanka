<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Care Sri Lanka</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white">
  <div id="root">ජනනය වෙමින් පවතී...</div>

  <script type="text/babel">
    function App() {
      const handleClick = () => {
        alert("Auto Care Sri Lanka ඇප් එක සාර්ථකව ක්‍රියාත්මකයි!");
      };

      return (
        <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
          <div className="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-700">
            <h1 className="text-2xl font-bold text-red-500 mb-2">Auto Care Sri Lanka</h1>
            <p className="text-slate-300 text-sm mb-6">පරිපූර්ණ වාහන සේවා සහ හදිසි සහන යෙදුම සාර්ථකව සූදානම්!</p>
            <button 
              onClick={handleClick}
              className="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 px-6 rounded-xl transition cursor-pointer"
            >
              ඇප් එක ක්‍රියාත්මකයි - ඔබන්න
            </button>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
