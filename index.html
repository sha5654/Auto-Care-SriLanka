    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return Number((R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)))).toFixed(1));
    }

      const t = TRANSLATIONS[lang] || TRANSLATIONS.si;
      const handleCycleLanguage = () => {
        setLang(prev => prev === 'si' ? 'en' : prev === 'en' ? 'ta' : 'si');
      };

      const [currentUser, setCurrentUser] = useState(() => {
        try { const s = localStorage.getItem('autocare_sl_user_v10'); return s ? JSON.parse(s) : null; } catch { return null; }
      });
      const [userAuthMode, setUserAuthMode] = useState('signin');
      const [userNameInput, setUserNameInput] = useState('');
      const [userEmailInput, setUserEmailInput] = useState('');
      const [userPassInput, setUserPassInput] = useState('');
      const [userAuthError, setUserAuthError] = useState('');
      const [showGoogleModal, setShowGoogleModal] = useState(false);
      const [googleEmail, setGoogleEmail] = useState('');
      const [googleName, setGoogleName] = useState('');

      const completeUserSignIn = (userObj) => {
        setCurrentUser(userObj);
        try { localStorage.setItem('autocare_sl_user_v10', JSON.stringify(userObj)); } catch {}
      };

      const handleUserSignOut = () => {
        setCurrentUser(null);
        setLoggedInAdmin(null);
        try { localStorage.removeItem('autocare_sl_user_v10'); } catch {}
      };

      const handleGoogleSubmit = (e) => {
        e.preventDefault();
        if (!googleEmail.includes('@')) { setUserAuthError('කරුණාකර නිවැරදි Gmail එකක් දෙන්න.'); return; }
        completeUserSignIn({ name: googleName.trim() || googleEmail.split('@')[0], email: googleEmail.trim().toLowerCase(), provider: 'google' });
        setShowGoogleModal(false);
      };

      const handleEmailAuthSubmit = (e) => {
        e.preventDefault();
        setUserAuthError('');
        const email = userEmailInput.trim().toLowerCase();
        const pass = userPassInput.trim();

        const matchedAdmin = ALLOWED_ADMINS.find(a => a.email.toLowerCase() === email && a.pass === pass);
        if (matchedAdmin) {
          completeUserSignIn({ name: matchedAdmin.name, email: matchedAdmin.email, provider: 'admin' });
          setLoggedInAdmin(matchedAdmin);
          return;
        }

        let storedUsers = [];
        try { storedUsers = JSON.parse(localStorage.getItem('autocare_sl_users_v10') || '[]'); } catch {}

        if (userAuthMode === 'signup') {
          if (!userNameInput.trim()) { setUserAuthError('නම ඇතුළත් කරන්න.'); return; }
          const newUser = { name: userNameInput.trim(), email, pass };
          try { localStorage.setItem('autocare_sl_users_v10', JSON.stringify([...storedUsers, newUser])); } catch {}
          completeUserSignIn({ name: newUser.name, email: newUser.email, provider: 'email' });
        } else {
          const found = storedUsers.find(u => u.email === email && u.pass === pass);
          if (!found) { setUserAuthError('Email හෝ Password වැරදියයි.'); return; }
          completeUserSignIn({ name: found.name, email: found.email, provider: 'email' });
        }
      };

      const [activeNav, setActiveNav] = useState('directory');
      
      const [customLogoUrl, setCustomLogoUrl] = useState(() => {
        try { return localStorage.getItem('autocare_sl_logo_v10') || ''; } catch { return ''; }
      });
      const [logoStatusMsg, setLogoStatusMsg] = useState('');

      const handleSaveLogo = (dataUrl) => {
        setCustomLogoUrl(dataUrl);
        try {
          if (dataUrl) { localStorage.setItem('autocare_sl_logo_v10', dataUrl); setLogoStatusMsg('Logo එක සාර්ථකව වෙනස් විය!'); }
          else { localStorage.removeItem('autocare_sl_logo_v10'); setLogoStatusMsg('Default Logo එකට මාරු කරන ලදී.'); }
        } catch {}
        setTimeout(() => setLogoStatusMsg(''), 3000);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { if (typeof reader.result === 'string') handleSaveLogo(reader.result); };
        reader.readAsDataURL(file);
      };

      const [listings, setListings] = useState(() => {
        try { const s = localStorage.getItem('autocare_sl_listings_v10'); return s ? JSON.parse(s) : INITIAL_LISTINGS; } catch { return INITIAL_LISTINGS; }
      });

      useEffect(() => {
        try { localStorage.setItem('autocare_sl_listings_v10', JSON.stringify(listings)); } catch {}
      }, [listings]);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDistrict, setSelectedDistrict] = useState('all');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedVehicle, setSelectedVehicle] = useState('all');

      const [userCoords, setUserCoords] = useState(null);
      const [gpsStatus, setGpsStatus] = useState('idle');

      const handleEnableGPS = () => {
        if (!navigator.geolocation) {
          setUserCoords({ lat: 6.9271, lng: 79.8612 });
          setGpsStatus('active');
          return;
        }
        setGpsStatus('loading');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            setUserCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            setGpsStatus('active');
          },
          () => {
            setUserCoords({ lat: 6.9271, lng: 79.8612 });
            setGpsStatus('active');
          }
        );
      };

      const [loggedInAdmin, setLoggedInAdmin] = useState(() => {
        if (currentUser?.email) {
          return ALLOWED_ADMINS.find(a => a.email.toLowerCase() === currentUser.email.toLowerCase()) || null;
        }
        return null;
      });
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminEmail, setAdminEmail] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [adminAuthError, setAdminAuthError] = useState('');

      const handleAdminLogin = (e) => {
        e.preventDefault();
        setAdminAuthError('');
        const matched = ALLOWED_ADMINS.find(a => a.email.toLowerCase() === adminEmail.trim().toLowerCase() && a.pass === adminPassword);
        if (matched) {
          setLoggedInAdmin(matched);
          setShowAdminModal(false);
          setActiveNav('admin');
          setAdminEmail(''); setAdminPassword('');
        } else {
          setAdminAuthError('Invalid Admin Email or Password.');
        }
      };

      const [showAddModal, setShowAddModal] = useState(false);
      const [formName, setFormName] = useState('');
      const [formCategory, setFormCategory] = useState('recovery');
      const [formVehicles, setFormVehicles] = useState(['car', 'van']);
      const [formDistrict, setFormDistrict] = useState('Colombo');
      const [formCity, setFormCity] = useState('');
      const [formAddress, setFormAddress] = useState('');
      const [formPhone, setFormPhone] = useState('');
      const [formWhatsapp, setFormWhatsapp] = useState('');
      const [formMapLink, setFormMapLink] = useState('');
      const [formSocialLink, setFormSocialLink] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formToast, setFormToast] = useState('');

      const toggleFormVehicle = (vId) => {
        setFormVehicles(prev => prev.includes(vId) ? prev.filter(v => v !== vId) : [...prev, vId]);
      };

      const handleAddSubmit = (e) => {
        e.preventDefault();
        if (!formName || !formAddress || !formPhone || !formCity || !formMapLink) return;

        const newShop = {
          id: `srv-${Date.now()}`,
          name: formName.trim(),
          category: formCategory,
          vehicles: formVehicles,
          district: formDistrict,
          city: formCity.trim(),
          address: formAddress.trim(),
          phone: formPhone.trim(),
          whatsapp: formWhatsapp.trim() || formPhone.trim(),
          mapLink: formMapLink.trim(),
          socialLink: formSocialLink.trim(),
          lat: 6.9271, lng: 79.8612,
          is247: true,
          verified: false,
          rating: 5.0,
          // STRICTLY PENDING UNLESS LOGGED IN ADMIN ADDS IT DIRECTLY
          status: loggedInAdmin ? 'approved' : 'pending',
          description: formDesc.trim() || '24/7 Reliable vehicle breakdown, recovery & workshop support.'
        };

        setListings([newShop, ...listings]);
        setFormToast(loggedInAdmin ? 'සේවා ස්ථානය සාර්ථකව එකතු විය!' : 'ඔබගේ ෂොප් එක සාර්ථකව යොමු කරන ලදී! Admin අනුමැතියෙන් පසු ප්‍රදර්ශනය කෙරේ.');
        setTimeout(() => {
          setFormToast('');
          setShowAddModal(false);
          setFormName(''); setFormCity(''); setFormAddress(''); setFormPhone(''); setFormWhatsapp(''); setFormMapLink(''); setFormSocialLink(''); setFormDesc('');
        }, 2500);
      };

      const handleApprove = (id) => {
        setListings(listings.map(item => item.id === id ? {...item, status: 'approved', verified: true} : item));

      const handleDelete = (id) => {
        if (confirm('මෙම සේවාව සම්පූර්ණයෙන්ම ඉවත් කිරීමට අවශ්‍ය බව විශ්වාසද?')) {
          setListings(listings.filter(item => item.id !== id));
        }
      };

      const openGoogleMaps = (query) => {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query + " Sri Lanka")}`, "_blank");
      };

      const filteredListings = useMemo(() => {
        return listings
          .filter(item => {
            // ONLY APPROVED ITEMS SHOW IN DIRECTORY UNLESS ADMIN IS VIEWING ALL
            if (item.status !== 'approved' && !loggedInAdmin) return false;
            if (selectedDistrict !== 'all' && item.district !== selectedDistrict) return false;
            if (selectedCategory !== 'all' && item.category !== selectedCategory) return false;
            if (selectedVehicle !== 'all' && !item.vehicles.includes(selectedVehicle)) return false;
            if (searchQuery.trim() !== '') {
              const q = searchQuery.toLowerCase();
              if (!item.name.toLowerCase().includes(q) && !item.address.toLowerCase().includes(q) && !item.district.toLowerCase().includes(q) && !(item.city && item.city.toLowerCase().includes(q))) return false;
            }
            return true;
          })
          .map(item => {
            const distanceKm = userCoords ? calculateDistanceKm(userCoords.lat, userCoords.lng, item.lat, item.lng) : null;
            return { ...item, distanceKm };
          })
          .sort((a, b) => {
            if (userCoords && a.distanceKm !== null && b.distanceKm !== null) return a.distanceKm - b.distanceKm;
            return b.rating - a.rating;
          });
      }, [listings, selectedDistrict, selectedCategory, selectedVehicle, searchQuery, userCoords, loggedInAdmin]);

      const pendingListings = useMemo(() => listings.filter(item => item.status === 'pending'), [listings]);
      const approvedListings = useMemo(() => listings.filter(item => item.status === 'approved'), [listings]);

      if (showSplash) {
        return (
          <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
            <div className="animate-bounce mb-4">
              <AppLogoDisplay customLogoUrl={customLogoUrl} className="w-20 h-20 rounded-3xl shadow-2xl shadow-red-600/50" />
            </div>
            <h1 className="text-xl font-black text-white tracking-wider">AUTO CARE <span className="text-red-500">SRI LANKA</span></h1>
            <p className="text-xs text-slate-400 mt-1">24/7 Islandwide Emergency Assistance</p>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between p-4">
            <div className="flex justify-end pt-2">
              <button onClick={handleCycleLanguage} className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-white text-xs font-bold flex items-center gap-1.5">
                <span>🌐 {lang === 'si' ? 'සිංහල' : lang === 'en' ? 'EN' : 'தமிழ்'}</span>
              </button>
            </div>

            <div className="max-w-sm w-full mx-auto my-auto space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4 text-center">
                <AppLogoDisplay customLogoUrl={customLogoUrl} className="w-16 h-16 mx-auto rounded-2xl shadow-lg" />
                <h1 className="text-xl font-black text-white">AUTO CARE <span className="text-red-500">SRI LANKA</span></h1>
                <p className="text-xs text-slate-400">{t.authWelcome}</p>

                {userAuthError && <div className="p-2.5 rounded-xl bg-red-950 border border-red-500 text-red-200 text-xs">{userAuthError}</div>}

                <button onClick={() => setShowGoogleModal(true)} className="w-full bg-white text-slate-950 font-black text-xs py-3 rounded-2xl shadow flex items-center justify-center gap-2">
                  <span>{t.continueGoogle}</span>
                </button>

                <div className="relative flex items-center justify-center">
                  <div className="border-t border-slate-800 w-full" />
                  <span className="bg-slate-900 px-2 text-[10px] uppercase text-slate-500 font-bold">OR</span>
                  <div className="border-t border-slate-800 w-full" />
                </div>

                <div className="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                  <button onClick={() => setUserAuthMode('signin')} className={`py-2 rounded-lg ${userAuthMode === 'signin' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>{t.signInTab}</button>
                  <button onClick={() => setUserAuthMode('signup')} className={`py-2 rounded-lg ${userAuthMode === 'signup' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>{t.signUpTab}</button>
                </div>

                <form onSubmit={handleEmailAuthSubmit} className="space-y-3 text-xs text-left">
                  {userAuthMode === 'signup' && (
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">නම (Name)</label>
                      <input type="text" required value={userNameInput} onChange={e => setUserNameInput(e.target.value)} placeholder="ඔබගේ නම" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                    </div>
                  )}
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Email</label>
                    <input type="email" required value={userEmailInput} onChange={e => setUserEmailInput(e.target.value)} placeholder="you@example.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Password</label>
                    <input type="password" required value={userPassInput} onChange={e => setUserPassInput(e.target.value)} placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  </div>
                  <button type="submit" className="w-full bg-red-600 text-white font-black py-3 rounded-xl shadow">{userAuthMode === 'signup' ? 'Create Account' : 'Sign In'}</button>
                </form>
              </div>
            </div>

            <div />

            {showGoogleModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/85 flex items-center justify-center p-4">
                <div className="bg-white text-slate-900 rounded-3xl max-w-sm w-full p-6 space-y-3">
                  <h3 className="text-base font-black">Sign in with Google</h3>
                  <form onSubmit={handleGoogleSubmit} className="space-y-3 text-xs">
                    <input type="text" value={googleName} onChange={e => setGoogleName(e.target.value)} placeholder="Full Name" className="w-full bg-slate-100 border border-slate-300 rounded-xl p-3" />
                    <input type="email" required value={googleEmail} onChange={e => setGoogleEmail(e.target.value)} placeholder="Gmail Address" className="w-full bg-slate-100 border border-slate-300 rounded-xl p-3" />
                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Continue</button>
                    <button type="button" onClick={() => setShowGoogleModal(false)} className="w-full text-slate-500 py-1">Cancel</button>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
          
          <header className="sticky top-0 z-40 bg-slate-900 border-b border-slate-800 px-3 py-2.5 shadow-lg">
            <div className="flex items-center justify-between gap-2">
              <div onClick={() => setActiveNav('directory')} className="flex items-center gap-2 cursor-pointer min-w-0">
                <AppLogoDisplay customLogoUrl={customLogoUrl} className="w-9 h-9 rounded-xl shadow shrink-0" />
                <div className="min-w-0">
                  <h1 className="text-xs sm:text-sm font-black text-white truncate">AUTO CARE <span className="text-red-500">SRI LANKA</span></h1>
                  <p className="text-[9px] text-slate-400 truncate">{currentUser.name}</p>
                </div>
              </div>

              <div className="flex items-center gap-1 shrink-0">
                <button onClick={handleCycleLanguage} className="px-2.5 py-1 rounded-lg bg-slate-800 text-white text-[10px] font-extrabold flex items-center gap-1">
                  <span>🌐 {lang === 'si' ? 'සිංහල' : lang === 'en' ? 'EN' : 'தமிழ்'}</span>
                </button>
                <button onClick={handleUserSignOut} className="px-2 py-1 rounded-lg bg-red-950 text-red-300 text-[10px] font-bold">Out</button>
              </div>
            </div>
          </header>

          <div className="p-3 space-y-3 max-w-md mx-auto">
            
            <div className={`p-2.5 rounded-xl border flex items-center justify-between gap-2 text-xs ${userCoords ? 'bg-emerald-950/50 border-emerald-800 text-emerald-200' : 'bg-blue-950/50 border-blue-800 text-blue-200'}`}>
              <span className="font-semibold truncate">{userCoords ? t.gpsActive : t.gpsPrompt}</span>
              <button onClick={handleEnableGPS} className={`px-2.5 py-1 rounded-lg text-white font-bold shrink-0 ${userCoords ? 'bg-emerald-600' : 'bg-blue-600'}`}>
                {userCoords ? 'GPS Update' : 'GPS On'}
              </button>
            </div>

            {activeNav === 'directory' && (
              <div className="space-y-3">
                <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800 space-y-2.5">
                  <input 
                    type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder={t.searchPlaceholder}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-red-500"
                  />

                  <div className="grid grid-cols-2 gap-2">
                    <select value={selectedDistrict} onChange={e => setSelectedDistrict(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-white">
                      <option value="all">{lang === 'si' ? 'සියලුම දිස්ත්‍රික්ක (25)' : lang === 'en' ? 'All Districts' : 'அனைத்து மாவட்டங்களும்'}</option>
                      {SRI_LANKA_DISTRICTS.map(d => <option key={d.id} value={d.id}>{d[lang] || d.si}</option>)}
                    </select>

                    <select value={selectedVehicle} onChange={e => setSelectedVehicle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-white">
                      <option value="all">{lang === 'si' ? 'සියලුම වාහන' : lang === 'en' ? 'All Vehicles' : 'அனைத்து'}</option>
                      {VEHICLE_TYPES.map(v => <option key={v.id} value={v.id}>{v[lang] || v.si}</option>)}
                    </select>
                  </div>

                  <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                    <button onClick={() => setSelectedCategory('all')} className={`px-2.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition ${selectedCategory === 'all' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                      {lang === 'si' ? 'සියලුම සේවා' : lang === 'en' ? 'All Services' : 'அனைத்து'}
                    </button>
                    {SERVICE_CATEGORIES.map(cat => (
                      <button key={cat.id} onClick={() => setSelectedCategory(cat.id)} className={`px-2.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat.id ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                        {cat[lang] || cat.si}
                      </button>
                    ))}
                  </div>
                </div>

                <button onClick={() => openGoogleMaps(selectedDistrict === 'all' ? 'Car Repair Garage Sri Lanka' : `Car Repair Garage in ${selectedDistrict}`)} className="w-full bg-blue-600/20 border border-blue-500/40 text-blue-300 text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 shadow-sm">
                  {t.mapBtn}
                </button>

                <div className="flex justify-between items-center px-1 text-xs text-slate-400">
                  <span>{t.foundCount} <strong className="text-white">{filteredListings.length}</strong></span>
                </div>

                <div className="space-y-3">
                  {filteredListings.map(shop => (
                    <div key={shop.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2 relative">
                      <div className="flex justify-between items-start">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-red-500/20 text-red-400 uppercase">{shop.category}</span>
                        {shop.distanceKm !== null && <span className="text-[11px] font-bold text-amber-400">📍 {shop.distanceKm} km</span>}
                      </div>
                      <h3 className="text-sm font-extrabold text-white">{shop.name}</h3>
                      <p className="text-[11px] text-slate-400">📍 {shop.district} ({shop.city}) • {shop.address}</p>
                      <p className="text-[11px] text-slate-300 bg-slate-950 p-2 rounded-xl">{shop.description}</p>
                      
                      <div className="flex flex-wrap gap-2 pt-1 items-center justify-between">
                        <div className="flex flex-wrap gap-2 flex-1">
                          <a href={`tel:${shop.phone}`} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-2 rounded-xl text-center shadow min-w-[90px]">📞 {shop.phone}</a>
                          {shop.whatsapp && <a href={`https://wa.me/${shop.whatsapp}`} target="_blank" rel="noopener noreferrer" className="bg-emerald-600 text-white font-bold text-xs px-3 py-2 rounded-xl text-center">💬 WA</a>}
                          <a href={shop.mapLink || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + ' ' + shop.city)}`} target="_blank" rel="noopener noreferrer" className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-3 py-2 rounded-xl text-center flex items-center gap-1 shadow">
                            🗺️ Map
                          </a>
                          {shop.socialLink && <a href={shop.socialLink} target="_blank" rel="noopener noreferrer" className="bg-indigo-600 text-white font-bold text-xs px-3 py-2 rounded-xl text-center">🔗 Social</a>}
                        </div>

                        {/* ADMIN CAN DELETE ANY SHOP DIRECTLY FROM VIEW */}
                        {loggedInAdmin && (
                          <button onClick={() => handleDelete(shop.id)} className="bg-red-950 text-red-400 border border-red-800 text-[11px] font-bold px-3 py-2 rounded-xl">
                            🗑️ Delete
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeNav === 'hotlines' && (
              <div className="space-y-3">
                <div className="bg-red-950/50 border border-red-800 p-3.5 rounded-2xl text-center"><h2 className="text-sm font-bold text-red-400">හදිසි ආපදා අංක</h2></div>
                <div className="space-y-2.5">
                  {EMERGENCY_HOTLINES.map(h => (
                    <a key={h.id} href={`tel:${h.number}`} className={`bg-gradient-to-br ${h.color} p-3.5 rounded-2xl shadow flex justify-between items-center text-white`}>
                      <div><p className="font-bold text-sm">{h.titleSi}</p></div>
                      <span className="bg-white text-slate-950 font-black text-lg px-3 py-1.5 rounded-xl">{h.number}</span>
                    </a>
                  ))}
                </div>
              </div>
            )}

            {activeNav === 'admin' && loggedInAdmin && (
              <div className="space-y-3">
                <div className="bg-slate-900 border border-amber-500/40 rounded-2xl p-3.5 flex justify-between items-center">
                  <div><h2 className="text-xs font-bold text-amber-400">⚙️ Admin Panel</h2></div>
                  <button onClick={() => setActiveNav('directory')} className="px-2.5 py-1 rounded-lg bg-slate-800 text-white text-xs">Back</button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5 text-xs">
                  <h3 className="font-bold text-white">Logo වෙනස් කිරීම (Admin Logo)</h3>
                  {logoStatusMsg && <p className="text-emerald-400 font-bold">{logoStatusMsg}</p>}
                  <div className="flex items-center gap-3">
                    <AppLogoDisplay customLogoUrl={customLogoUrl} className="w-12 h-12 rounded-xl border border-slate-700 shrink-0" />
                    <label className="px-3 py-1.5 rounded-xl bg-red-600 text-white font-bold cursor-pointer">
                      Upload Logo
                      <input type="file" accept="image/*" onChange={handleLogoUpload} className="hidden" />
                    </label>
                  </div>
                </div>

                {/* PENDING APPROVALS */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5 text-xs">
                  <h3 className="font-bold text-amber-400">අනුමැතිය අපේක්ෂිත ෂොප්ස් (Pending: {pendingListings.length})</h3>
                  {pendingListings.length === 0 ? (
                    <p className="text-slate-500 text-center py-2">අනුමත කිරීමට නව ෂොප් නොමැත.</p>
                  ) : (
                    pendingListings.map(item => (
                      <div key={item.id} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <p className="font-bold text-white">{item.name}</p>
                          <p className="text-[10px] text-slate-400">{item.district} ({item.city}) | {item.phone}</p>
                        </div>
                        <div className="flex gap-1.5">
                          <button onClick={() => handleApprove(item.id)} className="bg-emerald-600 text-white px-2 py-1 rounded-lg font-bold">Approve</button>
                          <button onClick={() => handleDelete(item.id)} className="bg-red-600 text-white px-2 py-1 rounded-lg font-bold">Delete</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* ALL ACTIVE SHOPS (CAN DELETE ANY) */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5 text-xs">
                  <h3 className="font-bold text-white">ප්‍රදර්ශනය වන සියලුම ෂොප්ස් (Active: {approvedListings.length})</h3>
                  {approvedListings.map(item => (
                    <div key={item.id} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                      <div>
                        <p className="font-bold text-white">{item.name}</p>
                        <p className="text-[10px] text-slate-400">{item.district} | {item.phone}</p>
                      </div>
                      <button onClick={() => handleDelete(item.id)} className="bg-red-950 text-red-400 border border-red-800 px-2.5 py-1 rounded-lg font-bold">Delete</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <nav className="fixed bottom-0 inset-x-0 z-40 bg-slate-900 border-t border-slate-800 px-2 py-1.5">
            <div className="grid grid-cols-4 gap-1 max-w-md mx-auto text-center">
              <button onClick={() => setActiveNav('directory')} className={`py-1.5 rounded-xl text-[10px] font-bold ${activeNav === 'directory' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>🔍 සේවා</button>
              <button onClick={() => setActiveNav('hotlines')} className={`py-1.5 rounded-xl text-[10px] font-bold ${activeNav === 'hotlines' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>🚨 හදිසි</button>
              <button onClick={() => setShowAddModal(true)} className="py-1.5 rounded-xl text-[10px] font-bold text-slate-300">➕ Shop</button>
              <button onClick={() => { if (loggedInAdmin) setActiveNav('admin'); else setShowAdminModal(true); }} className={`py-1.5 rounded-xl text-[10px] font-bold ${activeNav === 'admin' ? 'bg-amber-500 text-slate-950' : 'text-amber-400'}`}>⚙️ Admin</button>
            </div>
          </nav>

          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-4 relative my-auto text-xs space-y-3">
                <button onClick={() => setShowAddModal(false)} className="absolute right-4 top-4 text-slate-400 hover:text-white">✕</button>
                <h2 className="text-sm font-black text-red-500">{t.addShopTitle}</h2>

                {formToast && <div className="p-2.5 rounded-xl bg-emerald-950 border border-emerald-500 text-emerald-200 font-bold">{formToast}</div>}

                <form onSubmit={handleAddSubmit} className="space-y-2.5">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">{t.shopNameLabel}</label>
                    <input type="text" required value={formName} onChange={e => setFormName(e.target.value)} placeholder="උදා: Kandy Auto Care" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">{t.districtLabel}</label>
                      <select value={formDistrict} onChange={e => setFormDistrict(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                        {SRI_LANKA_DISTRICTS.map(d => <option key={d.id} value={d.id}>{d[lang] || d.si}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">{t.cityLabel}</label>
                      <input type="text" required value={formCity} onChange={e => setFormCity(e.target.value)} placeholder="උදා: පේරාදෙණිය" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">සේවා කාණ්ඩය</label>
                      <select value={formCategory} onChange={e => setFormCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                        {SERVICE_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c[lang] || c.si}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">{t.phoneLabel}</label>
                      <input type="tel" required value={formPhone} onChange={e => setFormPhone(e.target.value)} placeholder="0771234567" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">{t.vehTypeLabel}</label>
                    <div className="flex flex-wrap gap-1">
                      {VEHICLE_TYPES.map(v => {
                        const checked = formVehicles.includes(v.id);
                        return (
                          <button type="button" key={v.id} onClick={() => toggleFormVehicle(v.id)} className={`px-2 py-1 rounded-lg text-[10px] font-bold border ${checked ? 'bg-red-600 text-white border-red-500' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>
                            {checked ? '✓ ' : '+ '}{v[lang] || v.si}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">{t.addressLabel}</label>
                    <input type="text" required value={formAddress} onChange={e => setFormAddress(e.target.value)} placeholder="ප්‍රධාන වීදිය, නගරය" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">{t.waLabel}</label>
                      <input type="text" value={formWhatsapp} onChange={e => setFormWhatsapp(e.target.value)} placeholder="94771234567" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">{t.mapLinkL}</label>
                      <input type="url" required value={formMapLink} onChange={e => setFormMapLink(e.target.value)} placeholder="https://maps.google.com/..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">{t.socialLabel}</label>
                    <input type="url" value={formSocialLink} onChange={e => setFormSocialLink(e.target.value)} placeholder="Facebook / TikTok link" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">{t.descLabel}</label>
                    <textarea rows={2} value={formDesc} onChange={e => setFormDesc(e.target.value)} placeholder="විස්තරය..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  </div>

                  <button type="submit" className="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl shadow">{t.submitBtn}</button>
                </form>
              </div>
            </div>
          )}

          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-5 relative text-xs space-y-3">
                <button onClick={() => setShowAdminModal(false)} className="absolute right-4 top-4 text-slate-400">✕</button>
                <h3 className="text-sm font-black text-white">Admin Security Portal</h3>
                {adminAuthError && <div className="p-2 rounded-xl bg-red-950 text-red-200">{adminAuthError}</div>}
                <form onSubmit={handleAdminLogin} className="space-y-2.5">
                  <input type="email" required value={adminEmail} onChange={e => setAdminEmail(e.target.value)} placeholder="Admin Email" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <input type="password" required value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="Password" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <button type="submit" className="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl">Login</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
