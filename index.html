<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Care Sri Lanka</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased pb-20">

  <!-- Top Bar -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-base font-extrabold text-red-500 tracking-tight">Auto Care Sri Lanka</h1>
        <p class="text-[10px] text-slate-400">වාහන සේවා සහ හදිසි මාර්ග සහන</p>
      </div>
      <div class="flex gap-1.5 items-center">
        <button onclick="switchTab('emergency')" id="btn-emergency" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700">🚨 හදිසි</button>
        <button onclick="switchTab('addShop')" id="btn-addShop" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700">➕ Shop දමන්න</button>
        <button onclick="switchTab('admin')" id="btn-admin" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-amber-400 border border-slate-700">⚙️ Admin</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4" id="main-container">
    <!-- Dynamic Content Renders Here -->
  </main>

  <script>
    const DISTRICTS = [
      "සියලුම දිස්ත්‍රික්ක", "කොළඹ", "ගම්පහ", "කළුතර", "මහනුවර", "මාතලේ", "නුවරඑළිය",
      "ගාල්ල", "මාතර", "හම්බන්තොට", "යාපනය", "කුරුණෑගල", "පුත්තලම",
      "අනුරාධපුර", "පොළොන්නරුව", "බදුල්ල", "මොණරාගල", "රත්නපුර", "කෑගල්ල",
      "මඩකලපුව", "අම්පාර", "ත්‍රිකුණාමලය", "වවුනියාව", "මන්නාරම", "කිලිනොච්චිය", "මුලතිව්"
    ];

    const CATEGORIES = [
      { id: "all", label: "සියලුම සේවා" },
      { id: "garage", label: "ගෙරාජ්" },
      { id: "breakdown", label: "බ්‍රේක්ඩවුන්" },
      { id: "tyre", label: "ටයර් ෂොප්" },
      { id: "parts", label: "අමතර කොටස්" }
    ];

    let services = JSON.parse(localStorage.getItem("autocare_services")) || [
      { id: 1, name: "Colombo Hybrid & Auto Care", district: "කොළඹ", category: "garage", desc: "හයිබ්‍රිඩ් බැටරි සහ එන්ජින් ස්කෑන්", phone: "0112345678", address: "නුගේගොඩ", status: "approved" },
      { id: 2, name: "Expressway Towing 24/7", district: "කොළඹ", category: "breakdown", desc: "හදිසි ටෝවිං සහ ප්‍රවාහන සේවය", phone: "0771234567", address: "කඩවත", status: "approved" },
      { id: 3, name: "Kandy Bike Care Center", district: "මහනුවර", category: "garage", desc: "මෝටර් සයිකල් ටියුන්-අප් සහ එන්ජින්", phone: "0812233445", address: "පේරාදෙණිය පාර", status: "approved" }
    ];

    let currentTab = 'services';
    let selectedDistrict = 'සියලුම දිස්ත්‍රික්ක';
    let selectedCategory = 'all';
    let searchQuery = '';
    let isAdminLoggedIn = false;

    function switchTab(tab) {
      currentTab = tab;
      render();
    }

    function openGoogleMaps(query) {
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query + " Sri Lanka")}`, "_blank");
    }

    function handleAddShop(e) {
      e.preventDefault();
      const name = document.getElementById('shop-name').value;
      const district = document.getElementById('shop-district').value;
      const category = document.getElementById('shop-category').value;
      const phone = document.getElementById('shop-phone').value;
      const address = document.getElementById('shop-address').value;
      const desc = document.getElementById('shop-desc').value;

      if (!name || !phone || !address) {
        alert("කරුණාකර අත්‍යවශ්‍ය විස්තර පුරවන්න!");
        return;
      }

      const newService = {
        id: Date.now(),
        name, district, category, phone, address,
        desc: desc || "වාහන සේවා මධ්‍යස්ථානය",
        status: isAdminLoggedIn ? "approved" : "pending"
      };

      services.unshift(newService);
      localStorage.setItem("autocare_services", JSON.stringify(services));
      alert(isAdminLoggedIn ? "සේවා ස්ථානය සාර්ථකව එකතු කරන ලදී!" : "ඔබගේ ෂොප් එක සාර්ථකව යොමු කරන ලදී! Admin අනුමැතියෙන් පසු ප්‍රදර්ශනය කෙරේ.");
      currentTab = 'services';
      render();
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('admin-pass').value;
      if (pass === "admin123") {
        isAdminLoggedIn = true;
        render();
      } else {
        alert("මුරපදය වැරදියයි! (Password: admin123)");
      }
    }

    function approveService(id) {
      services = services.map(s => s.id === id ? {...s, status: 'approved'} : s);
      localStorage.setItem("autocare_services", JSON.stringify(services));
      render();
    }

    function deleteService(id) {
      if (confirm("මෙම සේවාව ඉවත් කිරීමට අවශ්‍ය බව විශ්වාසද?")) {
        services = services.filter(s => s.id !== id);
        localStorage.setItem("autocare_services", JSON.stringify(services));
        render();
      }
    }

    function render() {
      const container = document.getElementById('main-container');
      
      if (currentTab === 'emergency') {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-red-950/50 border border-red-800 p-4 rounded-2xl text-center">
              <h2 class="text-base font-bold text-red-400">හදිසි ආපදා සහ ආරක්ෂක අංක</h2>
              <p class="text-xs text-slate-300 mt-1">ක්ෂණිකව ඇමතුමක් ලබා ගැනීමට පහත අංක ඔබන්න</p>
            </div>
            <div class="grid grid-cols-1 gap-3">
              <a href="tel:119" class="bg-red-600 p-4 rounded-2xl shadow-lg flex justify-between items-center">
                <div><p class="font-bold text-base">පොලිස් හදිසි ඇමතුම්</p><p class="text-xs opacity-90">පැය 24 පුරා</p></div>
                <span class="bg-white text-slate-900 font-black text-xl px-4 py-2 rounded-xl">119</span>
              </a>
              <a href="tel:1990" class="bg-emerald-600 p-4 rounded-2xl shadow-lg flex justify-between items-center">
                <div><p class="font-bold text-base">සුවසැරිය ගිලන් රථ</p><p class="text-xs opacity-90">පැය 24 පුරා</p></div>
                <span class="bg-white text-slate-900 font-black text-xl px-4 py-2 rounded-xl">1990</span>
              </a>
              <a href="tel:110" class="bg-orange-600 p-4 rounded-2xl shadow-lg flex justify-between items-center">
                <div><p class="font-bold text-base">ගිනි නිවන සේවා</p><p class="text-xs opacity-90">පැය 24 පුරා</p></div>
                <span class="bg-white text-slate-900 font-black text-xl px-4 py-2 rounded-xl">110</span>
              </a>
              <a href="tel:1969" class="bg-blue-600 p-4 rounded-2xl shadow-lg flex justify-between items-center">
                <div><p class="font-bold text-base">අධිවේගී මාර්ග සහන</p><p class="text-xs opacity-90">පැය 24 පුරා</p></div>
                <span class="bg-white text-slate-900 font-black text-xl px-4 py-2 rounded-xl">1969</span>
              </a>
            </div>
            <button onclick="switchTab('services')" class="w-full bg-slate-800 text-white p-3 rounded-xl font-bold text-xs text-center mt-4">← මුල් පිටුවට යන්න</button>
          </div>
        `;
      } else if (currentTab === 'addShop') {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
            <h2 class="text-base font-bold text-red-500 mb-1">➕ නව ගෙරාජයක් හෝ ෂොප් එකක් එකතු කරන්න</h2>
            <form onsubmit="handleAddShop(event)" class="space-y-3">
              <div>
                <label class="block text-xs text-slate-300 mb-1">ආයතනයේ නම *</label>
                <input type="text" id="shop-name" placeholder="උදා: Kandy Auto Hub" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-red-500" required />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs text-slate-300 mb-1">දිස්ත්‍රික්කය</label>
                  <select id="shop-district" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    ${DISTRICTS.filter(d => d !== "සියලුම දිස්ත්‍රික්ක").map(d => `<option value="${d}">${d}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs text-slate-300 mb-1">කාණ්ඩය</label>
                  <select id="shop-category" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    ${CATEGORIES.filter(c => c.id !== "all").map(c => `<option value="${c.id}">${c.label}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs text-slate-300 mb-1">දුරකථන අංකය *</label>
                <input type="text" id="shop-phone" placeholder="0771234567" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white" required />
              </div>
              <div>
                <label class="block text-xs text-slate-300 mb-1">ලිපිනය / නගරය *</label>
                <input type="text" id="shop-address" placeholder="පේරාදෙණිය පාර, මහනුවර" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white" required />
              </div>
              <div>
                <label class="block text-xs text-slate-300 mb-1">විස්තරය</label>
                <input type="text" id="shop-desc" placeholder="එන්ජින් ටියුන්-අප් සහ බැටරි සේවා" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
              </div>
              <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs mt-2">🚀 යොමු කරන්න (Submit)</button>
              <button type="button" onclick="switchTab('services')" class="w-full bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs">← უკස් යන්න</button>
            </form>
          </div>
        `;
      } else if (currentTab === 'admin') {
        if (!isAdminLoggedIn) {
          container.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl text-center space-y-3">
              <h3 class="text-base font-bold text-amber-400">⚙️ Admin පාලක ප්‍රවේශය</h3>
              <p class="text-xs text-slate-400">මුරපදය ලබා දී ඇතුළු වන්න (Password: admin123)</p>
              <form onsubmit="handleAdminLogin(event)" class="space-y-2">
                <input type="password" id="admin-pass" placeholder="Admin password" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white text-center" required />
                <button type="submit" class="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl text-xs">Login</button>
              </form>
              <button onclick="switchTab('services')" class="w-full bg-slate-800 text-slate-300 py-2 rounded-xl text-xs">← මුල් පිටුවට</button>
            </div>
          `;
        } else {
          const pending = services.filter(s => s.status === 'pending');
          container.innerHTML = `
            <div class="space-y-4">
              <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                <h2 class="text-sm font-bold text-red-500 mb-2">⚙️ Admin Panel - අනුමත කිරීම් (${pending.length})</h2>
                <div class="space-y-2 max-h-80 overflow-y-auto">
                  ${pending.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">අනුමත කිරීමට නව ෂොප් නොමැත.</p>' : 
                    pending.map(s => `
                      <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <div>
                          <p class="font-bold text-white">${s.name}</p>
                          <p class="text-slate-400">${s.district} | ${s.phone}</p>
                        </div>
                        <div class="flex gap-1">
                          <button onclick="approveService(${s.id})" class="bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg font-bold">Approve</button>
                          <button onclick="deleteService(${s.id})" class="bg-red-600 text-white px-2.5 py-1.5 rounded-lg font-bold">මකන්න</button>
                        </div>
                      </div>
                    `).join('')}
                </div>
                <button onclick="switchTab('services')" class="w-full bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold mt-4">← මුල් පිටුවට</button>
              </div>
            </div>
          `;
        }
      } else {
        // Services Directory View
        const filtered = services.filter(s => {
          if (s.status !== 'approved' && !isAdminLoggedIn) return false;
          if (selectedDistrict !== 'සියලුම දිස්ත්‍රික්ක' && s.district !== selectedDistrict) return false;
          if (selectedCategory !== 'all' && s.category !== selectedCategory) return false;
          if (searchQuery && !s.name.toLowerCase().includes(searchQuery.toLowerCase()) && !s.address.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });

        container.innerHTML = `
          <div class="space-y-3">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
              <input type="text" id="search-input" value="${searchQuery}" oninput="searchQuery=this.value; render()" placeholder="ගෙරාජ් හෝ නගරය සොයන්න..." class="w-full bg-slate-950 text-white text-xs border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-red-500" />
              <select id="district-select" onchange="selectedDistrict=this.value; render()" class="w-full bg-slate-950 text-white text-xs border border-slate-700 rounded-xl px-3 py-2.5">
                ${DISTRICTS.map(d => `<option value="${d}" ${d===selectedDistrict?'selected':''}>${d}</option>`).join('')}
              </select>
              <div class="flex gap-1.5 overflow-x-auto pb-1">
                ${CATEGORIES.map(c => `
                  <button onclick="selectedCategory='${c.id}'; render()" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${selectedCategory===c.id?'bg-red-600 text-white':'bg-slate-800 text-slate-300'}">${c.label}</button>
                `).join('')}
              </div>
            </div>

            <button onclick="openGoogleMaps('${selectedDistrict==='සියලුම දිස්ත්‍රික්ක'?'Car Repair Garage':`Car Repair Garage in ${selectedDistrict}`}')" class="w-full bg-blue-600/20 border border-blue-500/40 text-blue-300 text-xs font-bold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2">
              🗺️ Google Maps හරහා ළඟම තියෙන ගෙරාජ් සොයන්න (Live Map)
            </button>

            <div class="space-y-3">
              ${filtered.length === 0 ? `
                <div class="bg-slate-900 p-8 rounded-2xl text-center border border-slate-800">
                  <p class="text-slate-400 text-sm">මෙම තේරීමට අදාළ සේවා ස්ථාන දැනට නොමැත.</p>
                </div>
              ` : filtered.map(s => `
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm">
                  <div class="flex justify-between items-start mb-1">
                    <h3 class="font-bold text-white text-base">${s.name}</h3>
                    <span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-md border border-slate-700">${s.district}</span>
                  </div>
                  <p class="text-xs text-slate-400 mb-2">${s.desc}</p>
                  <p class="text-[11px] text-slate-500 mb-3">📍 ${s.address}</p>
                  <div class="flex gap-2">
                    <a href="tel:${s.phone}" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 rounded-xl text-center">📞 ඇමතුම් (${s.phone})</a>
                    <button onclick="openGoogleMaps('${s.name} ${s.address}')" class="bg-slate-800 text-slate-200 text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-700">🗺️ Map</button>
                    ${isAdminLoggedIn ? `<button onclick="deleteService(${s.id})" class="bg-red-950 text-red-400 px-3 py-2.5 rounded-xl text-xs font-bold">මකන්න</button>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    render();
  </script>
</body>
</html>
