
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Care Sri Lanka</title>
  <meta name="description" content="Vehicle services, garages, and breakdown assistance directory in Sri Lanka" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (UMD Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white m-0 p-0">
  <div id="root"></div>

  <!-- Load and Execute App.jsx safely -->
  <script type="text/babel" data-presets="react" src="/App.jsx"></script>
  <script type="text/babel">
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const container = document.getElementById('root');
        if (container) {
          const root = ReactDOM.createRoot(container);
          // Check if App component exists
          if (typeof App !== 'undefined') {
            root.render(React.createElement(App));
          } else {
            container.innerHTML = '<div style="padding: 20px; color: white;">Error: App component not found. Please check App.jsx export.</div>';
          }
        }
      } catch (err) {
        console.error(err);
        document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">Error loading app: ' + err.message + '</div>';
      }
    });
  </script>
</body>
</html>
