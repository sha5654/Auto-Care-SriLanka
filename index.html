    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return Number((R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)))).toFixed(1));
    }

          {/* Top Bar */}
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow-xl">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
              <div onClick={() => setActiveNav('directory')} className="flex items-center gap-2.5 cursor-pointer">
                <DefaultRedVectorLogo customLogoUrl={customLogoUrl} className="w-10 h-10 rounded-2xl shadow-lg shadow-red-600/25" />
                <div>
                  <h1 className="text-sm sm:text-base font-black tracking-tight text-white">AUTO CARE <span className="text-red-500">SRI LANKA</span></h1>
                  <p className="text-[10px] text-slate-400">24/7 Islandwide Recovery & Garages</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setActiveNav('directory')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeNav === 'directory' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}>සේවා</button>
                <button onClick={() => setActiveNav('hotlines')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeNav === 'hotlines' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}>හදිසි</button>
                <button onClick={() => setShowAddModal(true)} className="px-3 py-1.5 rounded-xl bg-slate-800 text-red-400 text-xs font-bold">➕ Shop</button>
                <button onClick={() => { if(loggedInAdmin) setActiveNav('admin'); else setShowAdminModal(true); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeNav === 'admin' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-amber-400'}`}>
                  ⚙️ Admin {pendingListings.length > 0 && `(${pendingListings.length})`}
                </button>
              </div>
            </div>
          </header>

          <div className="max-w-4xl mx-auto px-4 pt-4 space-y-4">
            
            {/* GPS Proximity Banner */}
            <div className={`p-3 rounded-2xl border flex flex-wrap items-center justify-between gap-2 ${userCoords ? 'bg-emerald-950/60 border-emerald-500/40' : 'bg-blue-950/60 border-blue-500/40'}`}>
              <span className="text-xs font-bold text-slate-200">{userCoords ? t.gpsActive : t.gpsPrompt}</span>
              <button onClick={handleEnableGPS} className={`px-3 py-1.5 rounded-xl text-xs font-bold text-white shadow ${userCoords ? 'bg-emerald-600' : 'bg-blue-600'}`}>
                {gpsStatus === 'loading' ? t.gpsLoading : (userCoords ? t.gpsBtnUpdate : t.gpsBtnOn)}
              </button>
            </div>

            {/* DIRECTORY VIEW */}
            {activeNav === 'directory' && (
              <div className="space-y-4">
                
                {/* Search & Filters */}
                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-lg">
                  <input 
                    type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder={t.searchPlaceholder}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                  />

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <select value={selectedDistrict} onChange={(e) => setSelectedDistrict(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                      {SRI_LANKA_DISTRICTS.map(d => <option key={d.id} value={d.id}>{d.si}</option>)}
                    </select>

                    <select value={selectedVehicle} onChange={(e) => setSelectedVehicle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white">
                      {VEHICLE_TYPES.map(v => <option key={v.id} value={v.id}>{v.si}</option>)}
                    </select>
                  </div>

                  {/* Categories Pills */}
                  <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                    {SERVICE_CATEGORIES.map(cat => (
                      <button key={cat.id} onClick={() => setSelectedCategory(cat.id)} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat.id ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                        {cat.si}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Results count & cards */}
                <div className="flex justify-between items-center px-1">
                  <span className="text-xs text-slate-400 font-semibold">{t.foundCount} <span className="text-white font-bold">{filteredListings.length}</span></span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                  {filteredListings.map(shop => (
                    <div key={shop.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-lg">
                      <div>
                        <div className="flex justify-between items-start mb-2">
                          <span className="text-[10px] font-bold px-2.5 py-0.5 rounded bg-red-500/20 text-red-400 border border-red-500/30 uppercase">{shop.category}</span>
                          {shop.distanceKm !== null && <span className="text-[11px] font-extrabold text-amber-400">📍 {shop.distanceKm} km</span>}
                        </div>
                        <h3 className="text-base font-extrabold text-white">{shop.name}</h3>
                        <p className="text-xs text-slate-400 mt-1">📍 {shop.district} • {shop.address}</p>
                        <p className="text-xs text-slate-300 mt-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">{shop.description}</p>
                      </div>

                      <div className="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-slate-800">
                        <a href={`tel:${shop.phone}`} className="bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-2.5 rounded-xl text-center shadow">
                          📞 {shop.phone}
                        </a>
                        <a href={`https://www.google.com/maps/search/?api=1&query=${shop.lat},${shop.lng}`} target="_blank" rel="noopener noreferrer" className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs py-2.5 rounded-xl text-center">
                          🗺️ Map
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* HOTLINES VIEW */}
            {activeNav === 'hotlines' && (
              <div className="space-y-3.5">
                <div className="bg-red-950/50 border border-red-800 p-4 rounded-2xl text-center">
                  <h2 className="text-base font-bold text-red-400">හදිසි ආපදා සහ ආරක්ෂක අංක</h2>
                  <p className="text-xs text-slate-300 mt-1">ක්ෂණිකව ඇමතුමක් ලබා ගැනීමට පහත අංක ඔබන්න</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {EMERGENCY_HOTLINES.map(h => (
                    <a key={h.id} href={`tel:${h.number}`} className={`bg-gradient-to-br ${h.color} p-4 rounded-2xl shadow-lg flex justify-between items-center`}>
                      <div>
                        <span className="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-black/30 text-white">{h.badge}</span>
                        <p className="font-bold text-base mt-1 text-white">{h.titleSi}</p>
                        <p className="text-xs text-white/80">{h.desc}</p>
                      </div>
                      <span className="bg-white text-slate-950 font-black text-xl px-4 py-2 rounded-xl shadow shrink-0 ml-3">{h.number}</span>
                    </a>
                  ))}
                </div>
              </div>
            )}

            {/* ADMIN PANEL VIEW */}
            {activeNav === 'admin' && loggedInAdmin && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-amber-500/40 rounded-2xl p-4 flex justify-between items-center">
                  <div>
                    <h2 className="text-sm font-bold text-amber-400">⚙️ Admin Panel</h2>
                    <p className="text-xs text-slate-400">লොග් වී ඇත්තේ: {loggedInAdmin.name}</p>
                  </div>
                  <button onClick={() => { setLoggedInAdmin(null); setActiveNav('directory'); }} className="px-3 py-1.5 rounded-xl bg-red-950 text-red-300 border border-red-800 text-xs font-bold">Logout</button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h3 className="text-sm font-bold text-white">Pending Verification Requests ({pendingListings.length})</h3>
                  {pendingListings.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-4">අනුමැතිය සඳහා බලාපොරොත්තු වන ස්ථාන නොමැත.</p>
                  ) : (
                    pendingListings.map(item => (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                        <div>
                          <p className="font-bold text-white">{item.name}</p>
                          <p className="text-slate-400">{item.district} | {item.phone}</p>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => handleApprove(item.id)} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold">Approve</button>
                          <button onClick={() => handleDelete(item.id)} className="bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold">මකන්න</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

          </div>

          {/* ADD SHOP MODAL */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-5 relative my-auto">
                <button onClick={() => setShowAddModal(false)} className="absolute right-4 top-4 text-slate-400 hover:text-white">✕</button>
                <h2 className="text-base font-black text-red-500 mb-1">{t.addTitle}</h2>
                <p className="text-xs text-slate-400 mb-4">{t.addSubtitle}</p>

                {formToast && <div className="mb-3 p-3 rounded-xl bg-emerald-950 border border-emerald-500 text-emerald-200 text-xs font-bold">{formToast}</div>}

                <form onSubmit={handleAddSubmit} className="space-y-3 text-xs">
                  <input type="text" required value={formName} onChange={e => setFormName(e.target.value)} placeholder="ආයතනයේ නම (උදා: Kandy Auto Care)" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white" />
                  
                  <div className="grid grid-cols-2 gap-2">
                    <select value={formCategory} onChange={e => setFormCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
                      {SERVICE_CATEGORIES.filter(c => c.id !== 'all').map(c => <option key={c.id} value={c.id}>{c.si}</option>)}
                    </select>
                    <select value={formDistrict} onChange={e => setFormDistrict(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
                      {SRI_LANKA_DISTRICTS.filter(d => d.id !== 'all').map(d => <option key={d.id} value={d.id}>{d.si}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">සේවා සපයන වාහන වර්ග:</label>
                    <div className="flex flex-wrap gap-1.5">
                      {VEHICLE_TYPES.filter(v => v.id !== 'all').map(v => {
                        const checked = formVehicles.includes(v.id);
                        return (
                          <button type="button" key={v.id} onClick={() => toggleFormVehicle(v.id)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border ${checked ? 'bg-red-600 text-white border-red-500' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>
                            {checked ? '✓ ' : '+ '}{v.si}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <input type="text" required value={formAddress} onChange={e => setFormAddress(e.target.value)} placeholder="ලිපිනය (උදා: නුවර පාර, පේරාදෙණිය)" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white" />
                  <input type="tel" required value={formPhone} onChange={e => setFormPhone(e.target.value)} placeholder="දුරකථන අංකය (උදා: 0812233445)" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white" />
                  <textarea rows={2} value={formDesc} onChange={e => setFormDesc(e.target.value)} placeholder="සේවා විස්තරය..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white" />

                  <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-xl shadow-lg transition">{t.submitBtn}</button>
                </form>
              </div>
            </div>
          )}

          {/* ADMIN LOGIN MODAL */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 relative">
                <button onClick={() => setShowAdminModal(false)} className="absolute right-4 top-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-base font-black text-white mb-1">Admin Security Portal</h3>
                <p className="text-xs text-slate-400 mb-4">පරිපාලක විද්‍යුත් තැපෑල සහ මුරපදය ලබා දෙන්න.</p>

                {adminAuthError && <div className="mb-3 p-2.5 rounded-xl bg-red-950 border border-red-500 text-red-200 text-xs font-semibold">{adminAuthError}</div>}

                <form onSubmit={handleAdminLogin} className="space-y-3 text-xs">
                  <input type="email" required value={adminEmail} onChange={e => setAdminEmail(e.target.value)} placeholder="Admin Email" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white" />
                  <input type="password" required value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="Password" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white" />
                  <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl shadow">Login</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
