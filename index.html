<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Care Sri Lanka - Premium</title>
  <meta name="theme-color" content="#dc2626" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased pb-20">
  <div id="root" class="flex items-center justify-center min-h-screen text-slate-400 font-bold text-sm">
    <div class="animate-pulse flex flex-col items-center gap-3">
      <div class="w-12 h-12 border-4 border-red-500 border-t-transparent rounded-full animate-spin"></div>
      <p>Auto Care Sri Lanka පූරණය වෙමින් පවතී...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // 1. CUSTOM RED ROUNDED-SQUARE SVG LOGO
    const DefaultRedVectorLogo = ({ className = 'w-11 h-11' }) => (
      <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="22" fill="#DC2626"/>
        <path d="M 20 80 L 80 20 M 20 20 L 80 80" stroke="white" strokeWidth="8" strokeLinecap="round" opacity="0.3"/>
        <circle cx="50" cy="50" r="28" fill="white"/>
        <path d="M 35 48 L 40 40 L 60 40 L 65 48 L 70 48 L 70 58 L 65 58 L 65 62 L 60 62 L 60 58 L 40 58 L 40 62 L 35 62 L 35 58 L 30 58 L 30 48 Z" fill="#DC2626"/>
        <circle cx="40" cy="58" r="4" fill="white"/>
        <circle cx="60" cy="58" r="4" fill="white"/>
      </svg>
    );

    // 2. MULTILINGUAL DICTIONARY
    const TRANSLATIONS = {
      si: {
        subtitle: 'දිවයින පුරා රිකවරි, ගරාජ්, ඉන්ධන සහ හදිසි වාහන සේවා',
        gpsPrompt: 'ළඟම ඇති ගරාජ් සහ ශෙඩ් හඳුනා ගැනීමට Location (GPS) On කරන්න',
        gpsActive: 'GPS සක්‍රීයයි — ළඟම ඇති සේවා දුර අනුව පෙළගස්වා ඇත!',
        gpsBtnOn: '📍 GPS On කරන්න',
        gpsBtnUpdate: '📍 GPS යාවත්කාලීන කරන්න',
        gpsLoading: 'සොයමින්...',
        navDirectory: 'සේවා සොයන්න',
        navHotlines: 'හදිසි ඇමතුම්',
        navAdd: 'අලුත් ස්ථානයක්',
        searchPlaceholder: 'ගරාජ්, රිකවරි, ඉන්ධන පිරවුම්හල් හෝ නගරය...',
        allDistrictsLabel: 'සියලුම දිස්ත්‍රික්ක (25)',
        mapBtn: 'Live Map හරහා සොයන්න',
        noResults: 'මෙම තේරීමට අදාළ සේවා ස්ථාන දැනට නොමැත.',
        addShopMsg: '➕ ෂොප් එකක් එකතු කරන්න'
      },
      en: {
        subtitle: 'Islandwide Recovery, Garages, Fuel & Emergency Services',
        gpsPrompt: 'Turn on Location (GPS) to find nearest services',
        gpsActive: 'GPS Active — Services sorted by distance!',
        gpsBtnOn: '📍 Turn On GPS',
        gpsBtnUpdate: '📍 Update GPS',
        gpsLoading: 'Locating...',
        navDirectory: 'Directory',
        navHotlines: 'Hotlines',
        navAdd: 'Add New',
        searchPlaceholder: 'Search garages, recovery, fuel or city...',
        allDistrictsLabel: 'All Districts (25)',
        mapBtn: 'Find on Live Map',
        noResults: 'No services found for this selection.',
        addShopMsg: '➕ Add a Shop'
      }
    };

    const DISTRICTS = ["සියලුම දිස්ත්‍රික්ක", "කොළඹ", "ගම්පහ", "කළුතර", "මහනුවර", "මාතලේ", "නුවරඑළිය", "ගාල්ල", "මාතර", "හම්බන්තොට", "යාපනය", "කුරුණෑගල", "පුත්තලම", "අනුරාධපුර", "පොළොන්නරුව", "බදුල්ල", "මොණරාගල", "රත්නපුර", "කෑගල්ල", "මඩකලපුව", "අම්පාර", "ත්‍රිකුණාමලය", "වවුනියාව", "මන්නාරම", "කිලිනොච්චිය", "මුලතිව්"];
    
    const CATEGORIES = [
      { id: "all", label: "සියලුම සේවා" },
      { id: "garage", label: "ගෙරාජ්" },
      { id: "breakdown", label: "බ්‍රේක්ඩවුන් / ටෝවිං" },
      { id: "tyre", label: "ටයර් සහ බැටරි" },
      { id: "parts", label: "අමතර කොටස්" },
      { id: "fuel", label: "ඉන්ධන පිරවුම්හල්" }
    ];

    const INITIAL_SERVICES = [
      { id: 1, name: "Colombo Hybrid & Auto Care", district: "කොළඹ", category: "garage", desc: "හයිබ්‍රිඩ් බැටරි සහ එන්ජින් ස්කෑන්", phone: "0112345678", address: "නුගේගොඩ", status: "approved", lat: 6.8649, lng: 79.8997 },
      { id: 2, name: "Expressway Towing 24/7", district: "ගම්පහ", category: "breakdown", desc: "හදිසි ටෝවිං සහ ප්‍රවාහන සේවය", phone: "0771234567", address: "කඩවත (අධිවේගී පිවිසුම අසල)", status: "approved", lat: 7.0049, lng: 79.9405 },
      { id: 3, name: "Kandy Bike Care Center", district: "මහනුවර", category: "garage", desc: "මෝටර් සයිකල් ටියුන්-අප් සහ එන්ජින්", phone: "0812233445", address: "පේරාදෙණිය පාර", status: "approved", lat: 7.2906, lng: 80.6337 },
      { id: 4, name: "Galle Auto Electricals", district: "ගාල්ල", category: "garage", desc: "වාහන වයරින් සහ AC අලුත්වැඩියා", phone: "0912223344", address: "වක්වැල්ල පාර", status: "approved", lat: 6.0328, lng: 80.2149 }
    ];

    function App() {
      const [lang, setLang] = useState('si');
      const t = TRANSLATIONS[lang];
      
      const [activeTab, setActiveTab] = useState("services");
      
      // Changed storage key to v3 to bypass any old empty states
      const [services, setServices] = useState(() => {
        try { const s = localStorage.getItem("autocare_services_v3"); return s ? JSON.parse(s) : INITIAL_SERVICES; } catch { return INITIAL_SERVICES; }
      });

      const [selectedDistrict, setSelectedDistrict] = useState("සියලුම දිස්ත්‍රික්ක");
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      
      // GPS State
      const [gps, setGps] = useState(null);
      const [gpsLoading, setGpsLoading] = useState(false);

      useEffect(() => {
        localStorage.setItem("autocare_services_v3", JSON.stringify(services));
      }, [services]);

      const getLocation = () => {
        setGpsLoading(true);
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              setGps({ lat: position.coords.latitude, lng: position.coords.longitude });
              setGpsLoading(false);
            },
            (error) => {
              alert("Location ලබා ගැනීමට නොහැකි විය. කරුණාකර GPS On කරන්න.");
              setGpsLoading(false);
            }
          );
        } else {
          alert("ඔබගේ බ්‍රවුසරය GPS සඳහා සහය නොදක්වයි.");
          setGpsLoading(false);
        }
      };

      const filteredServices = useMemo(() => {
        return services.filter((item) => {
          if (item.status !== "approved") return false;
          const matchDistrict = selectedDistrict === "සියලුම දිස්ත්‍රික්ක" || item.district === selectedDistrict;
          const matchCategory = selectedCategory === "all" || item.category === selectedCategory;
          const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.address.toLowerCase().includes(searchQuery.toLowerCase());
          return matchDistrict && matchCategory && matchSearch;
        });
      }, [services, selectedDistrict, selectedCategory, searchQuery]);

      const openGoogleMaps = (query) => {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query + " Sri Lanka")}`, "_blank");
      };

      return (
        <div className="min-h-screen bg-slate-950">
          {/* Top Bar with Language Switcher & Logo */}
          <div className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 px-4 py-3 shadow-lg">
            <div className="max-w-md mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3">
                <DefaultRedVectorLogo className="w-10 h-10 shadow-lg shadow-red-600/20" />
                <div>
                  <h1 className="text-base font-extrabold text-red-500 tracking-tight">Auto Care Sri Lanka</h1>
                  <p className="text-[10px] text-slate-400 font-medium">{t.subtitle.substring(0, 35)}...</p>
                </div>
              </div>
              <div className="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700">
                <button onClick={() => setLang('si')} className={`px-2 py-1 text-[10px] font-bold rounded-md ${lang === 'si' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>SI</button>
                <button onClick={() => setLang('en')} className={`px-2 py-1 text-[10px] font-bold rounded-md ${lang === 'en' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>EN</button>
              </div>
            </div>
            
            {/* Tabs */}
            <div className="max-w-md mx-auto flex gap-2 mt-4 overflow-x-auto no-scrollbar">
              <button onClick={() => setActiveTab('services')} className={`flex-1 min-w-fit px-3 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'services' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-400'}`}>🚗 {t.navDirectory}</button>
              <button onClick={() => setActiveTab('emergency')} className={`flex-1 min-w-fit px-3 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'emergency' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-400'}`}>🚨 {t.navHotlines}</button>
              <button onClick={() => setActiveTab('add')} className={`flex-1 min-w-fit px-3 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'add' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-400'}`}>➕ {t.navAdd}</button>
            </div>
          </div>

          {/* Main Content Area */}
          <div className="max-w-md mx-auto p-4">
            {activeTab === 'services' && (
              <div className="space-y-4">
                
                {/* GPS Banner */}
                <div className={`p-4 rounded-2xl border ${gps ? 'bg-emerald-950/40 border-emerald-800' : 'bg-blue-950/40 border-blue-800'} flex flex-col items-center text-center gap-2 shadow-sm`}>
                  <p className={`text-xs font-bold ${gps ? 'text-emerald-400' : 'text-blue-400'}`}>
                    {gps ? t.gpsActive : t.gpsPrompt}
                  </p>
                  <button onClick={getLocation} className={`px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg transition ${gps ? 'bg-emerald-600' : 'bg-blue-600'} flex items-center justify-center min-w-[120px]`}>
                    {gpsLoading ? t.gpsLoading : (gps ? t.gpsBtnUpdate : t.gpsBtnOn)}
                  </button>
                </div>

                {/* Filters */}
                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-md">
                  <input 
                    type="text" placeholder={t.searchPlaceholder} value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-950 text-white text-sm border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-red-500"
                  />
                  <select value={selectedDistrict} onChange={(e) => setSelectedDistrict(e.target.value)} className="w-full bg-slate-950 text-white text-xs border border-slate-700 rounded-xl px-3 py-3">
                    <option value="සියලුම දිස්ත්‍රික්ක">{t.allDistrictsLabel}</option>
                    {DISTRICTS.filter(d => d !== "සියලුම දිස්ත්‍රික්ක").map((dist) => <option key={dist} value={dist}>{dist}</option>)}
                  </select>
                  <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                    {CATEGORIES.map((cat) => (
                      <button key={cat.id} onClick={() => setSelectedCategory(cat.id)} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat.id ? "bg-red-600 text-white" : "bg-slate-800 text-slate-300"}`}>
                        {cat.label}
                      </button>
                    ))}
                  </div>
                </div>

                <button onClick={() => openGoogleMaps(selectedDistrict === "සියලුම දිස්ත්‍රික්ක" ? "Vehicle Repair Services" : `Car Repair Garage in ${selectedDistrict}`)} className="w-full bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white text-xs font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2">
                  🗺️ {t.mapBtn}
                </button>

                {/* Results list */}
                <div className="space-y-3">
                  {filteredServices.length === 0 ? (
                    <div className="bg-slate-900 p-8 rounded-2xl text-center border border-slate-800">
                      <p className="text-slate-400 text-sm mb-3">{t.noResults}</p>
                      <button onClick={() => setActiveTab('add')} className="bg-red-600 text-white text-xs font-bold py-2 px-4 rounded-xl shadow">{t.addShopMsg}</button>
                    </div>
                  ) : (
                    filteredServices.map((s) => (
                      <div key={s.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm relative overflow-hidden">
                        <div className="absolute top-0 right-0 bg-red-600/10 text-red-500 text-[10px] font-extrabold px-3 py-1 rounded-bl-xl border-b border-l border-red-500/20">
                          {s.category.toUpperCase()}
                        </div>
                        <h3 className="font-bold text-white text-base mt-2">{s.name}</h3>
                        <p className="text-xs text-slate-400 mt-1">{s.desc}</p>
                        <div className="flex items-center gap-2 mt-2">
                          <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-1 rounded-lg border border-slate-700">📍 {s.district}</span>
                          <span className="text-[11px] text-slate-500">{s.address}</span>
                        </div>
                        <div className="flex gap-2 mt-4">
                          <a href={`tel:${s.phone}`} className="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-3 rounded-xl text-center shadow-lg">
                            📞 ඇමතුම්
                          </a>
                          <button onClick={() => openGoogleMaps(`${s.name} ${s.address}`)} className="bg-slate-800 text-white text-xs font-bold px-5 py-3 rounded-xl border border-slate-700 shadow">
                            🗺️ Map
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {activeTab === 'emergency' && (
              <div className="space-y-4">
                <div className="bg-red-950/50 border border-red-800 p-5 rounded-2xl text-center shadow-inner">
                  <h2 className="text-lg font-bold text-red-400">🚨 හදිසි අංක</h2>
                  <p className="text-xs text-slate-300 mt-1">ක්ෂණිකව ඇමතුමක් ලබා ගැනීමට ඔබන්න</p>
                </div>
                <div className="grid grid-cols-1 gap-3">
                  <a href="tel:119" className="bg-gradient-to-r from-red-600 to-red-700 p-4 rounded-2xl shadow-lg flex justify-between items-center">
                    <div><p className="font-bold text-base text-white">පොලිස් හදිසි ඇමතුම්</p></div>
                    <span className="bg-white text-red-700 font-black text-xl px-4 py-2 rounded-xl">119</span>
                  </a>
                  <a href="tel:1990" className="bg-gradient-to-r from-emerald-600 to-emerald-700 p-4 rounded-2xl shadow-lg flex justify-between items-center">
                    <div><p className="font-bold text-base text-white">සුවසැරිය ගිලන් රථ</p></div>
                    <span className="bg-white text-emerald-700 font-black text-xl px-4 py-2 rounded-xl">1990</span>
                  </a>
                  <a href="tel:1969" className="bg-gradient-to-r from-blue-600 to-blue-700 p-4 rounded-2xl shadow-lg flex justify-between items-center">
                    <div><p className="font-bold text-base text-white">අධිවේගී මාර්ග සහන</p></div>
                    <span className="bg-white text-blue-700 font-black text-xl px-4 py-2 rounded-xl">1969</span>
                  </a>
                </div>
              </div>
            )}

            {activeTab === 'add' && (
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                <h2 className="text-base font-bold text-red-500 mb-4 text-center">➕ ෂොප් එකක් එකතු කරන්න</h2>
                <p className="text-xs text-slate-400 text-center mb-4">ඔබගේ ආයතනය මෙහි ඇතුළත් කර Admin අනුමැතියට යොමු කරන්න.</p>
                <form className="space-y-3" onSubmit={(e) => { e.preventDefault(); alert('ඔබගේ ෂොප් එක සාර්ථකව යොමු කරන ලදී! අනුමැතියෙන් පසු ප්‍රදර්ශනය කෙරේ.'); setActiveTab('services'); }}>
                  <input type="text" placeholder="ආයතනයේ නම" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white" required />
                  <input type="text" placeholder="දුරකථන අංකය" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white" required />
                  <input type="text" placeholder="ලිපිනය සහ නගරය" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white" required />
                  <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg mt-2 transition">
                    🚀 යොමු කරන්න (Submit)
                  </button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
