<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Care Sri Lanka</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased">
  <div id="root" class="flex items-center justify-center min-h-screen text-slate-400">
    Auto Care Sri Lanka පූරණය වෙමින් පවතී...
  </div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const DISTRICTS = [
      "සියලුම දිස්ත්‍රික්ක", "කොළඹ", "ගම්පහ", "කළුතර", "මහනුවර", "මාතලේ", "නුවරඑළිය",
      "ගාල්ල", "මාතර", "හම්බන්තොට", "යාපනය", "කුරුණෑගල", "පුත්තලම",
      "අනුරාධපුර", "පොළොන්නරුව", "බදුල්ල", "මොණරාගල", "රත්නපුර", "කෑගල්ල",
      "මඩකලපුව", "අම්පාර", "ත්‍රිකුණාමලය", "වවුනියාව", "මන්නාරම", "කිලිනොච්චිය", "මුලතිව්"
    ];

    const VEHICLE_TYPES = [
      { id: "all", label: "සියලුම වාහන" },
      { id: "car", label: "🚗 කාර් / සෙඩාන්" },
      { id: "bike", label: "🏍️ මෝටර් සයිකල්" },
      { id: "van", label: "🚐 වෑන් / SUV" },
      { id: "heavy", label: "🚚 බර වාහන" }
    ];

    const CATEGORIES = [
      { id: "all", label: "සියලුම සේවා" },
      { id: "garage", label: "ගෙරාජ්" },
      { id: "breakdown", label: "බ්‍රේක්ඩවුන්" },
      { id: "tyre", label: "ටයර් ෂොප්" },
      { id: "parts", label: "අමතර කොටස්" }
    ];

    const INITIAL_SERVICES = [
      { id: 1, name: "Colombo Hybrid & Auto Care", district: "කොළඹ", vehicle: "car", category: "garage", desc: "හයිබ්‍රිඩ් බැටරි සහ එන්ජින් ස්කෑන්", phone: "0112345678", address: "නුගේගොඩ", status: "approved" },
      { id: 2, name: "Expressway Towing 24/7", district: "කොළඹ", vehicle: "all", category: "breakdown", desc: "හදිසි ටෝවිං සහ ප්‍රවාහන සේවය", phone: "0771234567", address: "කඩවත", status: "approved" },
      { id: 3, name: "Kandy Bike Care Center", district: "මහනුවර", vehicle: "bike", category: "garage", desc: "මෝටර් සයිකල් ටියුන්-අප් සහ එන්ජින්", phone: "0812233445", address: "පේරාදෙණිය පාර", status: "approved" },
      { id: 4, name: "Kegalle Auto Electricals", district: "කෑගල්ල", vehicle: "car", category: "garage", desc: "වාහන වයරින් සහ AC අලුත්වැඩියා", phone: "0352223344", address: "කොළඹ පාර", status: "approved" }
    ];

    const EMERGENCY_NUMBERS = [
      { label: "පොලිස් හදිසි ඇමතුම්", number: "119", color: "bg-red-600" },
      { label: "සුවසැරිය ගිලන් රථ", number: "1990", color: "bg-emerald-600" },
      { label: "ගිනි නිවන සේවා", number: "110", color: "bg-orange-600" },
      { label: "අධිවේගී මාර්ග සහන", number: "1969", color: "bg-blue-600" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("services");
      const [user, setUser] = useState(() => {
        try { const s = localStorage.getItem("autocare_user"); return s ? JSON.parse(s) : null; } catch { return null; }
      });

      const [services, setServices] = useState(() => {
        try { const s = localStorage.getItem("autocare_all_services"); return s ? JSON.parse(s) : INITIAL_SERVICES; } catch { return INITIAL_SERVICES; }
      });

      const [selectedDistrict, setSelectedDistrict] = useState("සියලුම දිස්ත්‍රික්ක");
      const [selectedVehicle, setSelectedVehicle] = useState("all");
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");

      // Add Shop Form State
      const [shopName, setShopName] = useState("");
      const [shopDistrict, setShopDistrict] = useState("කොළඹ");
      const [shopVehicle, setShopVehicle] = useState("car");
      const [shopCategory, setShopCategory] = useState("garage");
      const [shopPhone, setShopPhone] = useState("");
      const [shopAddress, setShopAddress] = useState("");
      const [shopDesc, setShopDesc] = useState("");

      // Admin Login State
      const [adminPass, setAdminPass] = useState("");
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      useEffect(() => {
        try { localStorage.setItem("autocare_all_services", JSON.stringify(services)); } catch {}
      }, [services]);

      useEffect(() => {
        try {
          if (user) localStorage.setItem("autocare_user", JSON.stringify(user));
          else localStorage.removeItem("autocare_user");
        } catch {}
      }, [user]);

      const filteredServices = useMemo(() => {
        return services.filter((item) => {
          if (item.status !== "approved" && !isAdminLoggedIn) return false;
          const matchDistrict = selectedDistrict === "සියලුම දිස්ත්‍රික්ක" || item.district === selectedDistrict;
          const matchVehicle = selectedVehicle === "all" || item.vehicle === "all" || item.vehicle === selectedVehicle;
          const matchCategory = selectedCategory === "all" || item.category === selectedCategory;
          const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.address.toLowerCase().includes(searchQuery.toLowerCase());
          return matchDistrict && matchVehicle && matchCategory && matchSearch;
        });
      }, [services, selectedDistrict, selectedVehicle, selectedCategory, searchQuery, isAdminLoggedIn]);

      const openGoogleMaps = (query) => {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query + " Sri Lanka")}`, "_blank");
      };

      const handleSocialLogin = (provider) => {
        const fakeUser = {
          name: provider === "Google" ? "ශෂික හෂාන් (Google)" : "ශෂික හෂාන් (Facebook)",
          email: "shashika@example.com",
          provider: provider
        };
        setUser(fakeUser);
        setActiveTab("services");
        alert(provider + " හරහා සාර්ථකව ඇතුළු විය!");
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === "admin123") {
          setIsAdminLoggedIn(true);
          alert("සාර්ථකයි! ඔබ Admin ලෙස ඇතුළු විය.");
          setActiveTab("adminPanel");
        } else {
          alert("මුරපදය වැරදියයි! (Admin password: admin123)");
        }
      };

      const handleAddShopSubmit = (e) => {
        e.preventDefault();
        if (!shopName || !shopPhone || !shopAddress) {
          alert("කරුණාකර සියලුම අත්‍යවශ්‍ය විස්තර පුරවන්න!");
          return;
        }

        const newShop = {
          id: Date.now(),
          name: shopName,
          district: shopDistrict,
          vehicle: shopVehicle,
          category: shopCategory,
          desc: shopDesc || "වාහන සේවා මධ්‍යස්ථානය",
          phone: shopPhone,
          address: shopAddress,
          status: isAdminLoggedIn ? "approved" : "pending"
        };

        setServices([newShop, ...services]);
        setShopName(""); setShopPhone(""); setShopAddress(""); setShopDesc("");

        if (isAdminLoggedIn) {
          alert("සේවා ස්ථානය සාර්ථකව එකතු කරන ලදී!");
        } else {
          alert("ඔබගේ ෂොප් එක සාර්ථකව යොමු කරන ලදී! Admin අනුමැතියෙන් පසු ප්‍රදර්ශනය කෙරේ.");
        }
        setActiveTab("services");
      };

      const handleApprove = (id) => {
        setServices(services.map(s => s.id === id ? {...s, status: "approved"} : s));
      };

      const handleDelete = (id) => {
        if (confirm("මෙම සේවාව ඉවත් කිරීමට අවශ්‍ය බව විශ්වාසද?")) {
          setServices(services.filter(s => s.id !== id));
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-white pb-20">
          {/* Top Bar */}
          <div className="bg-slate-900 border-b border-slate-800 sticky top-0 z-10 px-4 py-3 shadow-md">
            <div className="max-w-md mx-auto flex justify-between items-center">
              <div>
                <h1 className="text-base font-extrabold text-red-500 tracking-tight">Auto Care Sri Lanka</h1>
                <p className="text-[10px] text-slate-400">වාහන සේවා සහ හදිසි සහන</p>
              </div>
              <div className="flex gap-1.5 items-center">
                <button 
                  onClick={() => setActiveTab("emergency")}
                  className={`px-2 py-1 rounded-xl text-[10px] font-bold ${activeTab === "emergency" ? "bg-red-600 text-white" : "bg-slate-800 text-slate-300 border border-slate-700"}`}
                >
                  🚨 හදිසි
                </button>
                <button 
                  onClick={() => setActiveTab("addShop")}
                  className={`px-2 py-1 rounded-xl text-[10px] font-bold ${activeTab === "addShop" ? "bg-red-600 text-white" : "bg-slate-800 text-slate-300 border border-slate-700"}`}
                >
                  ➕ Shop දමන්න
                </button>
                {isAdminLoggedIn ? (
                  <button 
                    onClick={() => setActiveTab("adminPanel")}
                    className="px-2 py-1 rounded-xl text-[10px] font-bold bg-amber-600 text-white"
                  >
                    ⚙️ Panel
                  </button>
                ) : (
                  <button 
                    onClick={() => setActiveTab("login")}
                    className={`px-2 py-1 rounded-xl text-[10px] font-bold ${activeTab === "login" ? "bg-red-600 text-white" : "bg-slate-800 text-slate-300 border border-slate-700"}`}
                  >
                    👤 Login
                  </button>
                )}
              </div>
            </div>
          </div>

          <div className="max-w-md mx-auto p-4">
            {activeTab === "emergency" ? (
              <div className="space-y-4">
                <div className="bg-red-950/50 border border-red-800 p-4 rounded-2xl text-center">
                  <h2 className="text-base font-bold text-red-400">හදිසි ආපදා සහ ආරක්ෂක අංක</h2>
                  <p className="text-xs text-slate-300 mt-1">ක්ෂණිකව ඇමතුමක් ලබා ගැනීමට පහත අංක ඔබන්න</p>
                </div>
                <div className="grid grid-cols-1 gap-3">
                  {EMERGENCY_NUMBERS.map((em, idx) => (
                    <a key={idx} href={`tel:${em.number}`} className={`${em.color} p-4 rounded-2xl shadow-lg flex justify-between items-center`}>
                      <div>
                        <p className="font-bold text-base">{em.label}</p>
                        <p className="text-xs opacity-90">පැය 24 පුරා ක්‍රියාත්මකයි</p>
                      </div>
                      <span className="bg-white text-slate-900 font-black text-xl px-4 py-2 rounded-xl shadow">{em.number}</span>
                    </a>
                  ))}
                </div>
                <button onClick={() => openGoogleMaps("Nearest Police Station or Hospital")} className="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl font-bold text-sm text-center">
                  📍 ළඟම ඇති පොලිස් ස්ථානය / රෝහල සිතියමෙන් බලන්න
                </button>
                <button onClick={() => setActiveTab("services")} className="w-full bg-red-600 text-white p-3 rounded-xl font-bold text-xs text-center mt-2">
                  ← මුල් පිටුවට යන්න
                </button>
              </div>
            ) : activeTab === "login" ? (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl text-center">
                  <h2 className="text-base font-bold text-white mb-1">ගිණුමට ඇතුළු වන්න (Sign In)</h2>
                  <p className="text-xs text-slate-400 mb-4">සමාජ ජාල ගිණුම් හරහා පහසුවෙන් ලොග් වන්න</p>
                  <div className="space-y-2">
                    <button onClick={() => handleSocialLogin("Google")} className="w-full bg-white text-slate-900 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
                      🌐 Google හරහා ලොග් වන්න
                    </button>
                    <button onClick={() => handleSocialLogin("Facebook")} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
                      📘 Facebook හරහා ලොග් වන්න
                    </button>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                  <h3 className="text-sm font-bold text-red-400 mb-1">⚙️ Admin පාලක ප්‍රවේශය</h3>
                  <p className="text-[11px] text-slate-400 mb-3">පරිපාලකවරයෙක් නම් මුරපදය (admin123) ලබා දී ඇතුළු වන්න.</p>
                  <form onSubmit={handleAdminLogin} className="space-y-2">
                    <input 
                      type="password" 
                      placeholder="Admin password (admin123)"
                      value={adminPass}
                      onChange={(e) => setAdminPass(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:border-red-500"
                    />
                    <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                      Admin ලෙස ලොග් වන්න
                    </button>
                  </form>
                </div>
                <button onClick={() => setActiveTab("services")} className="w-full bg-slate-800 text-slate-300 p-3 rounded-xl font-bold text-xs text-center">
                  ← නැවත සේවා වෙත
                </button>
              </div>
            ) : activeTab === "adminPanel" ? (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                  <div className="flex justify-between items-center mb-3">
                    <h2 className="text-base font-bold text-red-500">⚙️ Admin Panel - අනුමත කිරීම්</h2>
                    <button onClick={() => { setIsAdminLoggedIn(false); setActiveTab("services"); }} className="text-xs text-red-400 underline font-bold">Logout</button>
                  </div>
                  <div className="space-y-3 max-h-96 overflow-y-auto">
                    {services.length === 0 ? (
                      <p className="text-xs text-slate-500 text-center py-4">සේවා ස්ථාන නොමැත.</p>
                    ) : (
                      services.map(s => (
                        <div key={s.id} className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                          <div className="flex justify-between items-start">
                            <div>
                              <h4 className="font-bold text-white text-sm">{s.name}</h4>
                              <p className="text-[11px] text-slate-400">{s.district} | {s.phone}</p>
                            </div>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${s.status === "approved" ? "bg-emerald-950 text-emerald-400 border border-emerald-800" : "bg-amber-950 text-amber-400 border border-amber-800"}`}>
                              {s.status === "approved" ? "Approved" : "Pending"}
                            </span>
                          </div>
                          <div className="flex gap-2 pt-1">
                            {s.status === "pending" && (
                              <button onClick={() => handleApprove(s.id)} className="flex-1 bg-emerald-600 text-white text-[11px] font-bold py-1.5 rounded-lg">
                                ✓ අනුමත කරන්න
                              </button>
                            )}
                            <button onClick={() => handleDelete(s.id)} className="bg-red-950 text-red-400 border border-red-800 px-3 py-1.5 rounded-lg text-[11px] font-bold">
                              මකන්න
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                  <button onClick={() => setActiveTab("services")} className="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs mt-4">
                    ← මුල් පිටුවට යන්න
                  </button>
                </div>
              </div>
            ) : activeTab === "addShop" ? (
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h2 className="text-base font-bold text-red-500 mb-1">➕ නව ගෙරාජයක් හෝ ෂොප් එකක් එකතු කරන්න</h2>
                <form onSubmit={handleAddShopSubmit} className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">ආයතනයේ නම *</label>
                    <input type="text" value={shopName} onChange={(e) => setShopName(e.target.value)} placeholder="උදා: Kandy Auto Hub" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs" required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">දිස්ත්‍රික්කය</label>
                      <select value={shopDistrict} onChange={(e) => setShopDistrict(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs">
                        {DISTRICTS.filter(d => d !== "සියලුම දිස්ත්‍රික්ක").map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">වාහන වර්ගය</label>
                      <select value={shopVehicle} onChange={(e) => setShopVehicle(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs">
                        {VEHICLE_TYPES.filter(v => v.id !== "all").map(v => <option key={v.id} value={v.id}>{v.label}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">සේවා කාණ්ඩය</label>
                      <select value={shopCategory} onChange={(e) => setShopCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs">
                        {CATEGORIES.filter(c => c.id !== "all").map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">දුරකථන අංකය *</label>
                      <input type="text" value={shopPhone} onChange={(e) => setShopPhone(e.target.value)} placeholder="0771234567" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs" required />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">ලිපිනය / නගරය *</label>
                    <input type="text" value={shopAddress} onChange={(e) => setShopAddress(e.target.value)} placeholder="පේරාදෙණිය පාර, මහනුවර" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs" required />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">විස්තරය</label>
                    <input type="text" value={shopDesc} onChange={(e) => setShopDesc(e.target.value)} placeholder="එන්ජින් ටියුන්-අප් සහ බැටරි සේවා" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs" />
                  </div>
                  <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs shadow-lg mt-2">
                    🚀 යොමු කරන්න (Submit)
                  </button>
                  <button type="button" onClick={() => setActiveTab("services")} className="w-full bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs mt-1">
                    ← უკස් යන්න
                  </button>
                </form>
              </div>
            ) : (
              <div>
                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 mb-4 shadow-sm">
                  <input 
                    type="text"
                    placeholder="ගෙරාජ්, ටෝවිං හෝ නගරය සොයන්න..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-950 text-white text-sm border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-red-500"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <select value={selectedDistrict} onChange={(e) => setSelectedDistrict(e.target.value)} className="w-full bg-slate-950 text-white text-xs border border-slate-700 rounded-xl px-3 py-2.5">
                      {DISTRICTS.map((dist) => <option key={dist} value={dist}>{dist}</option>)}
                    </select>
                    <select value={selectedVehicle} onChange={(e) => setSelectedVehicle(e.target.value)} className="w-full bg-slate-950 text-white text-xs border border-slate-700 rounded-xl px-3 py-2.5">
                      {VEHICLE_TYPES.map((v) => <option key={v.id} value={v.id}>{v.label}</option>)}
                    </select>
                  </div>
                  <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                    {CATEGORIES.map((cat) => (
                      <button
                        key={cat.id}
                        onClick={() => setSelectedCategory(cat.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${selectedCategory === cat.id ? "bg-red-600 text-white" : "bg-slate-800 text-slate-300"}`}
                      >
                        {cat.label}
                      </button>
                    ))}
                  </div>
                </div>

                <button onClick={() => openGoogleMaps(selectedDistrict === "සියලුම දිස්ත්‍රික්ක" ? "Car Repair Garage" : `Car Repair Garage in ${selectedDistrict}`)} className="w-full bg-blue-600/20 border border-blue-500/40 text-blue-300 text-xs font-bold py-2.5 px-4 rounded-xl mb-4 flex items-center justify-center gap-2">
                  🗺️ Google Maps හරහා ළඟම තියෙන ගෙරාජ් සොයන්න (Live Map)
                </button>

                <div className="flex justify-between items-center mb-3 px-1">
                  <span className="text-xs text-slate-400">සේවා ස්ථාන ({filteredServices.length})</span>
                  {isAdminLoggedIn && (
                    <button onClick={() => setActiveTab("adminPanel")} className="text-xs text-red-400 font-bold underline">
                      ⚙️ Admin Panel
                    </button>
                  )}
                </div>

                <div className="space-y-3">
                  {filteredServices.length === 0 ? (
                    <div className="bg-slate-900 p-8 rounded-2xl text-center border border-slate-800">
                      <p className="text-slate-400 text-sm">මෙම තේරීමට අදාළ සේවා ස්ථාන දැනට නොමැත.</p>
                      <button onClick={() => setActiveTab("addShop")} className="mt-3 bg-red-600 text-white text-xs font-bold py-2 px-4 rounded-xl shadow">
                        ➕ ෂොප් එකක් එකතු කරන්න
                      </button>
                    </div>
                  ) : (
                    filteredServices.map((service) => (
                      <div key={service.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm">
                        <div className="flex justify-between items-start mb-1">
                          <h3 className="font-bold text-white text-base">{service.name}</h3>
                          <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-md border border-slate-700">{service.district}</span>
                        </div>
                        <p className="text-xs text-slate-400 mb-2">{service.desc}</p>
                        <p className="text-[11px] text-slate-500 mb-3">📍 {service.address} | වාහන: <span className="text-slate-300 uppercase">{service.vehicle}</span></p>
                        <div className="flex gap-2">
                          <a href={`tel:${service.phone}`} className="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 rounded-xl text-center">
                            📞 ඇමතුම් ({service.phone})
                          </a>
                          <button onClick={() => openGoogleMaps(`${service.name} ${service.address}`)} className="bg-slate-800 text-slate-200 text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-700">
                            🗺️ Map
                          </button>
                          {isAdminLoggedIn && (
                            <button onClick={() => handleDelete(service.id)} className="bg-red-950 text-red-400 px-3 py-2.5 rounded-xl text-xs font-bold border border-red-800">
                              මකන්න
                            </button>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
